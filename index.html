<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Calculator</title>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap"
    >
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="calc">
        <div class="brand">
            <span>Model 01</span>

            <div class="solar" aria-hidden="true">
                <i></i>
                <i></i>
                <i></i>
                <i></i>
            </div>
        </div>

        <div class="lcd" aria-live="polite">
            <div class="expr" id="expr">
                <span></span>
            </div>
            <div class="main" id="main">0</div>
        </div>

        <div class="pad" id="pad">
            <button class="fn" data-k="Escape" data-a="clear" type="button">AC</button>
            <button class="fn" data-k="Backspace" data-a="back" type="button">⌫</button>
            <button class="fn" data-k="%" data-a="pct" type="button">%</button>
            <button class="op" data-k="/" data-a="op" data-v="÷" type="button">÷</button>

            <button data-k="7" data-a="num" data-v="7" type="button">7</button>
            <button data-k="8" data-a="num" data-v="8" type="button">8</button>
            <button data-k="9" data-a="num" data-v="9" type="button">9</button>
            <button class="op" data-k="*" data-a="op" data-v="×" type="button">×</button>

            <button data-k="4" data-a="num" data-v="4" type="button">4</button>
            <button data-k="5" data-a="num" data-v="5" type="button">5</button>
            <button data-k="6" data-a="num" data-v="6" type="button">6</button>
            <button class="op" data-k="-" data-a="op" data-v="−" type="button">−</button>

            <button data-k="1" data-a="num" data-v="1" type="button">1</button>
            <button data-k="2" data-a="num" data-v="2" type="button">2</button>
            <button data-k="3" data-a="num" data-v="3" type="button">3</button>
            <button class="op" data-k="+" data-a="op" data-v="+" type="button">+</button>

            <button class="fn" data-a="sign" type="button">±</button>
            <button data-k="0" data-a="num" data-v="0" type="button">0</button>
            <button data-k="." data-a="dot" type="button">.</button>
            <button class="eq" data-k="Enter" data-a="eq" type="button">=</button>
        </div>

        <p class="hint">Keyboard works too · Enter = · Esc clears</p>
    </main>
</body>
</html>
